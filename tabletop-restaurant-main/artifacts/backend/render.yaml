# Render Blueprint — free tier: https://render.com/docs/free
# 1. Push repo to GitHub
# 2. Render → New → Blueprint → connect repo (set root to artifacts/backend or deploy as Web Service manually)
# 3. Add env vars in dashboard (see DEPLOY.md)

services:
  - type: web
    name: tabletop-api
    runtime: python
    plan: free
    rootDir: artifacts/backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn restaurant.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
