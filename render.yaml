# https://render.com/docs/blueprint-spec
# Dashboard → New → Blueprint → connect this repo
# Then add secret env vars (DB_PASSWORD, EMAIL_*, DB_SSL_CA_PEM) in Render UI

services:
  - type: web
    name: tabletop-api
    runtime: python
    plan: free
    rootDir: artifacts/backend
    # Do not run migrate in build — it needs DB secrets and often fails before env is set
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn restaurant.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DB_HOST
        value: mysql-16196df4-saihanuman-7554.e.aivencloud.com
      - key: DB_PORT
        value: "21875"
      - key: DB_NAME
        value: defaultdb
      - key: DB_USER
        value: avnadmin
      - key: DB_SSL
        value: "true"
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA_PEM
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
