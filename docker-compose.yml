version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-restaurant_db}
      MYSQL_USER: ${DB_USER:-restaurant_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-restaurant_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./artifacts/backend
      dockerfile: Dockerfile
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             gunicorn restaurant.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=${DB_NAME:-restaurant_db}
      - DB_USER=${DB_USER:-restaurant_user}
      - DB_PASSWORD=${DB_PASSWORD:-restaurant_password}
      - DB_HOST=db
      - DB_PORT=3306
      - SECRET_KEY=${SECRET_KEY:-django-insecure-default-key-for-dev-only}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost}
      # Add your other production environment variables here (Cloudinary, Resend, Google Auth, etc.)
    depends_on:
      - db

  frontend:
    build:
      context: ./artifacts/restaurant-app
      dockerfile: Dockerfile
      args:
        # Pass the backend API URL to the Vite build process.
        # Change this to your actual backend domain (e.g., https://api.yourdomain.com) when deploying to AWS.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
  static_volume:
  media_volume:
